services:
  immich-server:
    volumes:
      - ./photos:/external/photos:ro
  quality:
    build: ./quality
    image: sysop-photo-quality:local
    user: "1000:1000"
    ports:
      - "192.168.1.224:18788:8080"
    volumes:
      - ./photos:/photos
      - ./quarantine:/quarantine
      - ./state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QUALITY_PASSWORD: ${QUALITY_PASSWORD}
      QUALITY_CSRF: ${QUALITY_CSRF}
      VISION_MODEL: ${VISION_MODEL:-qwen3.8:27b}
      OLLAMA_URL: http://host.docker.internal:11434
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
